# Kubuntu 26.04
# Uses Docker image: partha09/kubuntu:26.04
# Build Darkly from upstream release tag and publish .deb package

name: Darkly - Kubuntu 26.04

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Darkly version (e.g. 0.5.39). Leave empty for latest tag.'
        required: false
        type: string
        default: ''

env:
  KUBUNTU_RELEASE: "26.04"
  BUILD_REPO: https://github.com/Bali10050/Darkly

jobs:
  build:
    runs-on: ubuntu-26.04
    container: partha09/kubuntu:26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Update container packages
        run: |
          apt-get update -y
          apt-get full-upgrade -y

      - name: Resolve version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            latest_tag=$(git -c 'versionsort.suffix=-' ls-remote --exit-code --refs --sort='version:refname' --tags $BUILD_REPO '*.*' \
                         | tail --lines=1 | cut --delimiter='/' --fields=3)
            version=$(echo "$latest_tag" | sed 's/^v//')
            echo "Detected latest tag: $latest_tag (version: $version)"
            echo "VERSION=$version" >> "$GITHUB_ENV"
          fi

      - name: Download release tarball
        run: |
          curl -L $BUILD_REPO/archive/refs/tags/v${{ env.VERSION }}.tar.gz \
               --output darkly-v${{ env.VERSION }}.tar.gz

      - name: Extract source
        run: tar xvf darkly-v${{ env.VERSION }}.tar.gz

      - name: Build Darkly
        run: |
          cmake_opts=(
            -B Darkly-${{ env.VERSION }}/build
            -S Darkly-${{ env.VERSION }}
            -DBUILD_DEBS=ON
          )
          cmake "${cmake_opts[@]}" \
            && cmake --build Darkly-${{ env.VERSION }}/build -j$(nproc) \
            && echo "Build completed!" \
            || { echo "Build failed!"; exit 1; }

      - name: Build DEB
        run: |
          cd Darkly-${{ env.VERSION }}/build
          cpack -G DEB -V -DCPACK_THREADS=$(nproc)
          artifact=$GITHUB_WORKSPACE/Darkly-${{ env.VERSION }}/packages/darkly-${{ env.VERSION }}_amd64.deb
          publish_filename="darkly-${{ env.VERSION }}_kubuntu-${{ env.KUBUNTU_RELEASE }}_amd64.deb"
          mv $artifact $GITHUB_WORKSPACE/$publish_filename
          echo "ARTIFACT=$publish_filename" >> "$GITHUB_ENV"
          SHA256SUM=$(sha256sum $GITHUB_WORKSPACE/$publish_filename | awk '{ print $1 }')
          echo "ARTIFACT = $publish_filename | SHA256SUM = $SHA256SUM"
          echo "SHA256SUM=$SHA256SUM" >> "$GITHUB_ENV"

      - name: Publish DEB
        if: ${{ env.SHA256SUM != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          retention-days: 1
