# Kubuntu 26.04
# Uses Docker image: partha09/kubuntu:26.04
# Build Darkly and publish .deb package
# Trigger: manually (workflow_dispatch) OR via workflow_call from darkly-ci.yml

name: Darkly - Kubuntu 26.04

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Darkly version to build (e.g. 0.5.39)'
        required: true
        type: string
  workflow_call:
    inputs:
      cache-file-path:
        required: true
        type: string
      version:
        required: true
        type: string

env:
  KUBUNTU_RELEASE: "26.04"
  BUILD_REPO: https://github.com/Bali10050/Darkly

jobs:
  build:
    runs-on: ubuntu-26.04
    container: partha09/kubuntu:26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Download source tarball (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          curl -L $BUILD_REPO/archive/refs/tags/v${{ inputs.version }}.tar.gz \
               --output darkly-v${{ inputs.version }}.tar.gz
          echo "TARBALL=darkly-v${{ inputs.version }}.tar.gz" >> "$GITHUB_ENV"

      - name: Restore cached tarball (ci trigger)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/cache/restore@v5.0.5
        with:
          key: ${{ runner.os }}-v${{ inputs.version }}-${{ hashFiles(inputs.cache-file-path) }}
          path: ${{ inputs.cache-file-path }}
          fail-on-cache-miss: true

      - name: Set tarball path (ci trigger)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: echo "TARBALL=${{ inputs.cache-file-path }}" >> "$GITHUB_ENV"

      - name: Extract source
        run: tar xvf ${{ env.TARBALL }}

      - name: Build Darkly
        run: |
          cmake_opts=(
            -B Darkly-${{ inputs.version }}/build
            -S Darkly-${{ inputs.version }}
            -DBUILD_DEBS=ON
          )
          cmake "${cmake_opts[@]}" \
            && cmake --build Darkly-${{ inputs.version }}/build -j$(nproc) \
            && echo "Build completed!" \
            || { echo "Build failed!"; exit 1; }

      - name: Build DEB
        id: create_deb_package
        run: |
          cd Darkly-${{ inputs.version }}/build
          cpack -G DEB -V -DCPACK_THREADS=$(nproc)
          artifact=$GITHUB_WORKSPACE/Darkly-${{ inputs.version }}/packages/darkly-${{ inputs.version }}_amd64.deb
          publish_filename="darkly-${{ inputs.version }}_kubuntu-${{ env.KUBUNTU_RELEASE }}_amd64.deb"
          mv $artifact $GITHUB_WORKSPACE/$publish_filename
          echo "ARTIFACT=$publish_filename" >> "$GITHUB_ENV"
          SHA256SUM=$(sha256sum $GITHUB_WORKSPACE/$publish_filename | awk '{ print $1 }')
          echo "ARTIFACT = $publish_filename | SHA256SUM = $SHA256SUM"
          echo "SHA256SUM=$SHA256SUM" >> "$GITHUB_ENV"

      - name: Publish DEB
        if: ${{ env.SHA256SUM != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          retention-days: 1
